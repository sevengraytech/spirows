# ─────────────────────────────────────────────────────────────────────────────
# Supervisor Configuration for Evilginx + Web UI
# Runs both Evilginx proxy and Flask Web UI in single container
# ─────────────────────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid
user=root

[program:evilginx]
command=/usr/local/bin/evilginx-entrypoint.sh
user=evilginx
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/config/logs/evilginx-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/config/logs/evilginx-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=EVILGINX_CONFIG_DIR="/config",EVILGINX_PHISHLETS_DIR="/config/phishlets",EVILGINX_CERTS_DIR="/config/certs",EVILGINX_LOG_FILE="/config/logs/evilginx.log"

[program:evilginx-ui]
command=gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4 --access-logfile /config/logs/ui-access.log --error-logfile /config/logs/ui-error.log ui.app:app
directory=/app
user=ui
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/config/logs/ui-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/config/logs/ui-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PYTHONPATH="/app",UI_SECRET_KEY="%(ENV_UI_SECRET_KEY)s",UI_USERNAME="%(ENV_UI_USERNAME)s",UI_PASSWORD="%(ENV_UI_PASSWORD)s",EVILGINX_CONFIG_DIR="/config",EVILGINX_BIN="/usr/local/bin/evilginx"

# ─────────────────────────────────────────────────────────────────────────────
# Event listener for graceful shutdown
# ─────────────────────────────────────────────────────────────────────────────

[eventlistener:shutdown]
command=bash -c 'while read line; do supervisorctl shutdown; done'
events=PROCESS_STATE_EXITED